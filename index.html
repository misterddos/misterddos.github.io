<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf8ff">
  <meta name="description" content="Instagram oficial de ip_zo_an">
  <title>Instagram — ip_zo_an</title>
  <style>
    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: #eaf8ff;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: #19374a;
    }

    main {
      width: 100%;
      max-width: 360px;
      padding: 32px 22px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #d2e8f2;
      border-radius: 20px;
      box-shadow: 0 8px 28px rgba(35, 91, 120, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(24px, 6vw, 30px);
      overflow-wrap: anywhere;
    }

    p {
      margin: 0 0 24px;
      line-height: 1.6;
      color: #526b7b;
    }

    a {
      display: inline-block;
      max-width: 100%;
      padding: 14px 22px;
      border-radius: 12px;
      background: #176fca;
      color: white;
      font-weight: 650;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    a:focus-visible {
      outline: 3px solid #19374a;
      outline-offset: 4px;
    }

    footer {
      margin-top: 24px;
      color: #718795;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>@ip_zo_an</h1>
    <p>Meu espaço no Instagram.</p>
    <a href="https://www.instagram.com/ip_zo_an/"
       target="_blank"
       rel="noopener noreferrer">
      Abrir meu Instagram
    </a>
    <footer>© ip_zo_an</footer>
  </main>
</body>
</html>
