<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b08">
  <title>MisterLab OS</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #080b08;
      color: #d7ffe0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
    }

    main {
      width: 100%;
      max-width: 1000px;
      margin: 24px auto;
    }

    header {
      border-bottom: 1px solid #245b35;
      margin-bottom: 20px;
      padding-bottom: 12px;
    }

    h1 { color: #62ff8b; }

    #status {
      color: #b4d7bd;
      overflow-wrap: anywhere;
    }

    #screen_container {
      min-height: 260px;
      overflow: auto;
      border: 1px solid #245b35;
      border-radius: 10px;
      background: #000;
      padding: 8px;
    }

    #screen_container > div {
      white-space: pre;
      font: 14px/14px monospace;
    }

    #screen_container canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    button, a {
      padding: 10px 14px;
      border: 1px solid #397c4c;
      border-radius: 7px;
      background: #101b13;
      color: #62ff8b;
      text-decoration: none;
      font: inherit;
    }

    button:disabled {
      opacity: .5;
    }

    .note {
      color: #9cb0a0;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>MISTERLAB OS</h1>
      <p>Ambiente Linux emulado no navegador.</p>
      <p id="status" role="status" aria-live="polite">
        Preparando o emulador...
      </p>
    </header>

    <div id="screen_container" tabindex="0"
         aria-label="Tela da máquina virtual">
      <div>Inicializando a tela...</div>
      <canvas style="display:none"></canvas>
    </div>

    <div class="controls">
      <button id="start" disabled>Iniciar novamente</button>
      <button id="stop" disabled>Parar emulador</button>
      <a href="./">Voltar ao MisterLab</a>
    </div>

    <p class="note">
      O sistema é executado no navegador. A primeira inicialização
      pode demorar. O desempenho depende do aparelho.
    </p>
  </main>

  <script src="./vendor/v86/libv86.js"></script>
  <script>
    (() => {
      const status = document.getElementById("status");
      const startButton = document.getElementById("start");
      const stopButton = document.getElementById("stop");
      const screen = document.getElementById("screen_container");

      let emulator = null;

      function setStatus(message) {
        status.textContent = message;
      }

      function startEmulator() {
        if (emulator) return;

        if (typeof window.V86 !== "function") {
          setStatus("Erro: a biblioteca v86 não foi carregada.");
          return;
        }

        setStatus("Carregando BIOS, WebAssembly e imagem Linux...");
        startButton.disabled = true;

        try {
          emulator = new window.V86({
            wasm_path: "./vendor/v86/v86.wasm",
            memory_size: 128 * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,
            screen_container: screen,
            bios: {
              url: "./vendor/v86/bios/seabios.bin"
            },
            vga_bios: {
              url: "./vendor/v86/bios/vgabios.bin"
            },
            cdrom: {
              url: "./vendor/v86/images/linux.iso"
            },
            autostart: true
          });
          window.emulator = emulator;

          emulator.add_listener("emulator-ready", () => {
            setStatus("Emulador pronto. Inicializando o sistema...");
            startButton.disabled = true;
            stopButton.disabled = false;
          });

          emulator.add_listener("emulator-started", () => {
            setStatus("Máquina virtual em execução.");
          });

          emulator.add_listener("download-progress", (progress) => {
            if (progress && progress.total) {
              const percent = Math.round(
                progress.loaded / progress.total * 100
              );
              setStatus("Carregando recursos: " + percent + "%");
            }
          });

          emulator.add_listener("emulator-stopped", () => {
            setStatus("Emulador parado.");
            emulator = null;
            window.emulator = null;
            startButton.disabled = false;
            stopButton.disabled = true;
          });

          emulator.add_listener("download-error", (error) => {
            setStatus("Erro ao baixar um recurso do emulador. Confira os arquivos e os caminhos.");
            startButton.disabled = false;
            console.error("Erro de download do v86:", error);
          });
        } catch (error) {
          emulator = null;
          startButton.disabled = false;
          setStatus("Falha ao iniciar: " + error.message);
        }
      }

      startButton.addEventListener("click", startEmulator);

      stopButton.addEventListener("click", () => {
        if (emulator) {
          emulator.stop();
        }
      });

      window.addEventListener("load", startEmulator);
    })();
  </script>

<div id="mobile-term" style="max-width:720px;margin:12px auto;padding:0 12px;font-family:monospace;">
  <pre id="serial-out" style="background:#000;color:#0f0;padding:10px;height:200px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0 0 8px;border-radius:6px;"></pre>
  <form id="serial-form" style="display:flex;gap:6px;">
    <input id="serial-in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="digite aqui e toque em Enviar"
      style="flex:1;padding:10px;font-family:monospace;font-size:16px;">
    <button type="submit" style="padding:10px 14px;">Enviar</button>
  </form>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">
    <button type="button" data-key="\r">Enter</button>
    <button type="button" data-key="\t">Tab</button>
    <button type="button" data-key="\x03">Ctrl+C</button>
    <button type="button" data-key="\x04">Ctrl+D</button>
    <button type="button" data-key="\x1b[A">↑</button>
    <button type="button" data-key="\x1b[B">↓</button>
  </div>
</div>

<script>
(function () {
  const out = document.getElementById("serial-out");
  const input = document.getElementById("serial-in");
  const form = document.getElementById("serial-form");

  let attached = null;
  let decoder = new TextDecoder("utf-8");

  function attach() {
    const emu = window.emulator || null;
    if (emu === attached) return;
    attached = emu;
    decoder = new TextDecoder("utf-8");
    if (emu && emu.add_listener) {
      emu.add_listener("serial0-output-byte", (byte) => {
        out.textContent += decoder.decode(Uint8Array.of(byte), { stream: true });
        out.scrollTop = out.scrollHeight;
      });
    }
  }

  setInterval(attach, 300);

  function send(text) {
    const emu = window.emulator || null;
    if (!emu || !emu.serial0_send) {
      out.textContent += "\n[Linux ainda não iniciou]\n";
      return;
    }
    emu.serial0_send(text);
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    send(input.value + "\r");
    input.value = "";
    input.focus();
  });

  document.querySelectorAll("[data-key]").forEach((btn) => {
    btn.addEventListener("click", () => {
      send(btn.dataset.key.replace(/\\r/g, "\r").replace(/\\t/g, "\t")
        .replace(/\\x([0-9a-f]{2})/gi, (_, h) => String.fromCharCode(parseInt(h, 16))));
    });
  });
})();
</script>

</body>
</html>
