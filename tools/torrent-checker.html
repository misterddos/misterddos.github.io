<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MisterLab - Torrent Checker</title>
<style>
body{background:#050807;color:#eee;font:16px Arial;padding:20px}
main{max-width:650px;margin:30px auto;border:1px solid #39ff88;padding:22px;border-radius:12px}
h1{color:#39ff88}
input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:7px}
input{background:#111;color:white;border:1px solid #39ff88}
button{background:#39ff88;border:0;font-weight:bold}
#out{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:20px}
</style>
</head>
<body>
<main>
<h1>MISTERLAB_</h1>
<p>TORRENT URL CHECKER</p>
<input id="url" placeholder="Cole a URL .torrent ou magnet:" />
<button onclick="check()">VERIFICAR</button>
<div id="out">Aguardando URL...</div>
</main>
<script>
async function check(){
  const raw = document.getElementById('url').value.trim();
  const out = document.getElementById('out');

  function result(title, lines, color){
    out.style.color = color;
    out.innerHTML = '';
    const heading = document.createElement('strong');
    heading.textContent = title;
    out.appendChild(heading);
    const details = document.createElement('pre');
    details.style.whiteSpace = 'pre-wrap';
    details.style.font = 'inherit';
    details.textContent = '\n\n' + lines.join('\n');
    out.appendChild(details);
  }

  if(!raw){
    result('⚠ NENHUM LINK INFORMADO',
      ['Cole uma URL ou magnet link para iniciar a análise.'], '#ffd479');
    return;
  }

  if(raw.length > 4096){
    result('✖ LINK MUITO LONGO',
      ['O limite permitido é de 4096 caracteres.'], '#ff7777');
    return;
  }

  if(/^magnet:\?/i.test(raw)){
    let u;
    try { u = new URL(raw); }
    catch {
      result('✖ MAGNET MALFORMADO',
        ['Não foi possível interpretar o link.'], '#ff7777');
      return;
    }

    const hash = u.searchParams.getAll('xt').find(v =>
      /^urn:btih:(?:[a-f0-9]{40}|[a-z2-7]{32})$/i.test(v)
    );

    if(!hash){
      result('✖ MAGNET INVÁLIDO', [
        'Identificador BitTorrent (xt=urn:btih) ausente ou incorreto.',
        'Confira se o link foi copiado por completo.'
      ], '#ff7777');
      return;
    }

    result('✓ MAGNET RECONHECIDO', [
      'Tipo: Magnet link',
      'Hash BitTorrent: válido no formato',
      'Trackers informados: ' + u.searchParams.getAll('tr').length,
      'Nome informado: ' + (u.searchParams.get('dn') || 'não informado'),
      '',
      'Disponibilidade: não testada',
      'Integridade dos arquivos: não verificada',
      'Próximo passo: abrir em um cliente BitTorrent confiável.'
    ], '#39ff88');
    return;
  }

  let u;
  try { u = new URL(raw); }
  catch {
    result('✖ URL INVÁLIDA', [
      'Informe o endereço completo, incluindo https:// ou http://.'
    ], '#ff7777');
    return;
  }

  if(!['http:', 'https:'].includes(u.protocol) ||
     !u.hostname.includes('.') || u.username || u.password){
    result('✖ ENDEREÇO NÃO ACEITO', [
      'Use uma URL HTTP ou HTTPS válida, sem credenciais embutidas.'
    ], '#ff7777');
    return;
  }

  const isTorrent = /\.torrent$/i.test(u.pathname);
  result('◌ TESTANDO CONEXÃO...', [
    'Endereço: ' + u.href,
    'Tipo estimado: ' + (isTorrent ? 'possível arquivo .torrent' : 'link de download ou página'),
    'Aguardando resposta do servidor...'
  ], '#ffd479');

  try{
    const r = await fetch(u.href, {
      method: 'HEAD',
      mode: 'cors',
      redirect: 'follow',
      signal: AbortSignal.timeout(10000)
    });

    const type = r.headers.get('content-type') || 'não informado';
    let title, color, meaning;

    if(r.status >= 200 && r.status < 300){
      title = '✓ SERVIDOR RESPONDEU';
      color = '#39ff88';
      meaning = 'O endereço respondeu com sucesso; isso não garante que o conteúdo seja um torrent válido.';
    } else if(r.status === 404){
      title = '✖ ARQUIVO NÃO ENCONTRADO (404)';
      color = '#ff7777';
      meaning = 'O servidor informou que o recurso não foi encontrado.';
    } else if(r.status === 403){
      title = '⚠ ACESSO NEGADO (403)';
      color = '#ffd479';
      meaning = 'O servidor recusou o acesso à solicitação.';
    } else {
      title = '⚠ RESPOSTA HTTP ' + r.status;
      color = '#ffd479';
      meaning = 'O servidor respondeu, mas o resultado precisa ser interpretado conforme o site.';
    }

    result(title, [
      'Status HTTP: ' + r.status + ' ' + r.statusText,
      'Tipo de conteúdo: ' + type,
      'HTTPS: ' + (u.protocol === 'https:' ? 'sim' : 'não'),
      'Redirecionado: ' + (r.redirected ? 'sim' : 'não'),
      '',
      meaning,
      'Integridade do arquivo: não verificada'
    ], color);
  } catch(e){
    result('⚠ VERIFICAÇÃO INCONCLUSIVA', [
      'O navegador não conseguiu confirmar a resposta do servidor.',
      'Possíveis causas: CORS, bloqueio de requisição HEAD, falha de rede ou tempo esgotado.',
      '',
      'Isso NÃO prova que o link esteja quebrado.',
      'Endereço: ' + u.href
    ], '#ffd479');
  }
}
</script>
</body>
</html>
